
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Seating Allocation System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Exam Seating Allocation System</h1>
    <p>Data Structures Microproject | C++ Concept</p>
</header>

<main>
    <section class="card">
        <h2>Add Student</h2>
        <input type="number" id="roll" placeholder="Roll Number">
        <input type="text" id="studentName" placeholder="Student Name">
        <input type="text" id="subject" placeholder="Subject">
        <button onclick="addStudent()">Add Student</button>
    </section>

    <section class="card">
        <h2>Add Examination Hall</h2>
        <input type="text" id="hallName" placeholder="Hall Name">
        <input type="number" id="capacity" placeholder="Hall Capacity">
        <button onclick="addHall()">Add Hall</button>
    </section>

    <section class="card">
        <h2>Seat Allocation</h2>
        <button onclick="allocateSeats()">Allocate Seats</button>
        <button onclick="displayStudents()">View Seating Plan</button>
        <button onclick="validatePlan()">Validate Allocation</button>
    </section>

    <section class="card">
        <h2>Search Student</h2>
        <input type="number" id="searchRoll" placeholder="Enter Roll Number">
        <button onclick="searchStudent()">Search</button>
        <p id="searchResult"></p>
    </section>

    <section class="card">
        <h2>Student Seating Plan</h2>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Roll No.</th>
                        <th>Name</th>
                        <th>Subject</th>
                        <th>Hall</th>
                        <th>Seat No.</th>
                    </tr>
                </thead>
                <tbody id="studentTable"></tbody>
            </table>
        </div>
        <p id="status"></p>
    </section>

    <section class="card">
        <h2>Examination Halls</h2>
        <div id="hallList">No halls added yet.</div>
    </section>
</main>

<footer>
    <p>Exam Seating Allocation System | Data Structures Project</p>
</footer>

<script src="script.js"></script>
</body>
</html>
